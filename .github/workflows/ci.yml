name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build (includes SEO lint gate)
        run: bun run build

      # Lint carries pre-existing debt (no-explicit-any / no-useless-escape).
      # Kept non-blocking so it is visible in CI without blocking merges; make it
      # a hard gate once the backlog is burned down.
      - name: Lint (non-blocking)
        run: bun run lint
        continue-on-error: true

# NOTE: Playwright e2e (e2e/, playwright.config.ts) is intentionally not run here.
# @playwright/test is not a tracked dependency and the suite exercises the live
# Supabase backend (which 401s without credentials), so it would be flaky in CI.
# Add a dedicated e2e job with browsers + a seeded/mocked backend when ready.
